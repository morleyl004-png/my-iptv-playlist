name: Update IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and combine playlists
        shell: python
        run: |
          import urllib.request

          urls = [
              "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/refs/heads/main/playlists/plutotv_all.m3u",
              "https://iptv-org.github.io/iptv/index.m3u",
              "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/refs/heads/main/playlists/samsungtvplus_all.m3u"
          ]

          output = ["#EXTM3U"]

          for url in urls:
              print(f"Downloading: {url}")

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(request, timeout=60) as response:
                  content = response.read().decode("utf-8", errors="replace")

              lines = content.splitlines()

              for line in lines:
                  if line.strip() == "#EXTM3U":
                      continue
                  output.append(line)

          with open("combined.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print(f"Created combined.m3u with {len(output)} lines")

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add combined.m3u

          git diff --cached --quiet || git commit -m "Update combined IPTV playlist"
          git push
